services:
  - type: web
    name: ai-web-apps-rag
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENABLED_MODELS
        value: llm
      - key: LLM_BACKEND
        value: openai_compatible
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        sync: false
      - key: USE_FASTEMBED
        value: "false"
      - key: USE_RERANKER
        value: "false"
